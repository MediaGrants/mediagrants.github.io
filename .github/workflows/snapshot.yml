name: Fetch funder pages

# Runs half an hour before the daily sweep. GitHub Actions can reach the open
# web; the cloud sandbox the sweep runs in cannot. So this job does the looking
# and commits what it saw, and the sweep reads it from disk half an hour later.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Fetch every source, ignoring the tier schedule"
        type: boolean
        default: false
      only:
        description: "Fetch a single source id (e.g. ij4eu)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch pages
        run: |
          ARGS=""
          if [ "${{ inputs.all }}" = "true" ]; then ARGS="$ARGS --all"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only=${{ inputs.only }}"; fi
          node scripts/snapshot.mjs $ARGS

      - name: Commit snapshots
        run: |
          git config user.name "grant-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --staged --quiet; then
            echo "Funder pages unchanged since the last fetch."
          else
            git commit -m "Funder pages: $(date -u +%Y-%m-%d)"
            # The sweep pushes to the same branch; if it got there first, rebase
            # rather than fail and leave the sweep with yesterday's pages.
            git pull --rebase --quiet
            git push
          fi
